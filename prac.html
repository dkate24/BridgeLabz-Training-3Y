<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #f2f2f2;
        }
        h1{
            text-align: center;
        }
        form{
            width:400px;
            height: 600px;
            margin:30px auto;
            padding:20px;
            border: 3px solid #ddd;
            border-radius: 15px;
            display:flex;
            flex-direction: column;
            gap:5px;
        }


        .submit{
            background:cornflowerblue;
            padding:5px;
        
        }





    </style>
</head>
<body>
    <h1>Student Registration Portal</h1>
    <br>
    <form action="/register" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="name">
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="email" required><br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="age"><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" placeholder="date of birth"><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder="phone number"><br>

        <div>
        <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label class="" for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label class="" for="female">Female</label>
            <input type="radio" id="other" name="gender" value="female">
            <label class="" for="other">Other</label>
            <br>
        </div>
        <div>
        <label for="skills">Skills:</label>
        <input type="checkbox" id="Javascript" name="skills" value="Javascript">
        <label class="" for="Javascript">Javascript</label>
        <input type="checkbox" id="java" name="skills" value="java">
        <label class="" for="java">Java</label>
        </div>
        <label for="branch">Select branch:</label>
        <select name="branch" id="branch">
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
        </select>
      


        <button type="submit" class="submit">Submit</button>
        <button type="reset"> Reset</button>

    </form>

</body>
</html>
